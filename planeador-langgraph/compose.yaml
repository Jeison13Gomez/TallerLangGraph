
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list; do
          sleep 3
        done
        ollama pull qwen2.5:3b
    restart: "no"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MODELO_OLLAMA: qwen2.5:3b
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully



  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
