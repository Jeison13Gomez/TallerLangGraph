<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PruebaChat — consola local</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --paper:   #E9ECE8;
    --surface: #FCFDFB;
    --ink:     #14181A;
    --muted:   #6A736E;
    --line:    #C9CFC9;
    --ok:      #2E6B4F;
    --err:     #B03A2E;
    --wait:    #8A6A1F;

    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }

  .shell {
    width: 100%;
    max-width: 720px;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ---- Barra de diagnóstico: modelo, endpoint y alcanzabilidad ---- */
  .rail {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--line);
  }
  .rail h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.01em;
  }
  .rail .probe {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    flex: none;
  }
  .dot[data-state="up"]      { background: var(--ok); }
  .dot[data-state="down"]    { background: var(--err); }
  .dot[data-state="probing"] { background: var(--wait); }

  /* ---- Transcripción ---- */
  .transcript {
    flex: 1;
    min-height: 340px;
    max-height: 58vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 4px 2px;
  }
  .empty {
    margin: auto;
    max-width: 34ch;
    text-align: center;
    color: var(--muted);
    font-size: 13.5px;
  }

  .turn { display: flex; flex-direction: column; gap: 4px; }
  .turn .who {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .turn .body {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding: 10px 13px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--surface);
  }
  .turn[data-who="user"] { align-items: flex-end; }
  .turn[data-who="user"] .body {
    background: transparent;
    border-style: dashed;
  }
  .turn[data-who="fault"] .body {
    border-color: var(--err);
    color: var(--err);
  }

  /* Sello de diagnóstico por turno: latencia real y estado devuelto */
  .stamp {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .stamp b { font-weight: 600; color: var(--ink); }

  /* Metricas de uso de la respuesta: consumo de tokens, modelo y velocidad */
  .usage {
    display: flex;
    flex-wrap: wrap;
    gap: 2px 14px;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--muted);
  }
  .usage span { white-space: nowrap; }
  .usage b { font-weight: 600; color: var(--ink); }
  .usage .na { font-style: italic; }

  /* Reto 3: fuentes (archivo y extractos) de los fragmentos usados como contexto */
  .sources { font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .sources b { font-weight: 600; color: var(--ink); }
  .sources summary { cursor: pointer; }
  .sources ol { margin: 4px 0 0; padding-left: 18px; }
  .sources li { margin-bottom: 4px; }

  /* ---- Composición ---- */
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 3px;
  }
  .composer input::placeholder { color: var(--muted); }
  .composer button {
    padding: 11px 20px;
    font: inherit;
    font-weight: 600;
    color: var(--surface);
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 3px;
    cursor: pointer;
  }
  .composer button:hover:not(:disabled) { background: #2C3436; }
  .composer button:disabled,
  .composer input:disabled { opacity: 0.5; cursor: not-allowed; }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .hint {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    min-height: 1.4em;
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  /* ---- RAG: carga de documentos ---- */
  .uploader { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .uploader input[type=file] { flex: 1; min-width: 0; font: inherit; font-size: 13px; }
  .uploader button {
    padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--ink); border-radius: 3px;
  }
  .uploader button:disabled { opacity: 0.5; cursor: not-allowed; }
  .uploader .hint { flex-basis: 100%; }

  /* Ocultar la carga de documentos RAG */
  .uploader[hidden] {
      display: none !important;
  }

  
</style>
</head>
<body>
<main class="shell">

  <div class="rail">
    <h1>PruebaChat</h1>
    <span class="probe">
      <span class="dot" id="dot" data-state="probing"></span>
      <span id="probe-text">comprobando el modelo…</span>
    </span>
  </div>
  

  <form class="uploader" id="uploader" hidden>
    <input type="file" id="file" accept=".pdf,.docx,.pptx,.txt,.md,.html">
    <button type="submit" id="upload">Cargar documento</button>
    <p class="hint" id="upload-status"></p>
  </form>

  <div class="transcript" id="transcript" role="log" aria-live="polite" aria-label="Conversación">
    <p class="empty" id="empty">Escribe una pregunta para enviarla al modelo que corre en Ollama.</p>
  </div>

  <form class="composer" id="composer">
    <label for="input" class="sr-only" hidden>Pregunta</label>
    <input id="input" autocomplete="off" placeholder="Escribe tu pregunta" required>
    <button type="submit" id="send">Enviar</button>
  </form>

  <p class="hint" id="hint"></p>

</main>

<script>
(() => {
  "use strict";

  // Configurable sin recompilar: define window.PRUEBACHAT_API antes de este script
  // (o mediante una variable inyectada en el contenedor) para apuntar a otro host.
  const API = "";

  // Debe ser >= spring.http.client.read-timeout del backend. Una inferencia de
  // llama3 en CPU puede tardar minutos la primera vez.
  const TIMEOUT_MS = 180000;

  // sessionId estable por pestaña: el backend ya lo acepta y lo registra en logs.
  const SESSION_ID = (crypto.randomUUID?.() || String(Date.now()));

  const $transcript = document.getElementById("transcript");
  const $empty      = document.getElementById("empty");
  const $form       = document.getElementById("composer");
  const $input      = document.getElementById("input");
  const $send       = document.getElementById("send");
  const $hint       = document.getElementById("hint");
  const $dot        = document.getElementById("dot");
  const $probeText  = document.getElementById("probe-text");

  /* ---------- Render ---------- */

  const NOT_AVAILABLE = "no disponible";

  // Cada respuesta construye su propio elemento de metricas: no hay estado compartido,
  // asi ninguna metrica puede pasar a otra respuesta. Todo con textContent (datos del modelo).
  function buildUsage(usage) {
    const box = document.createElement("div");
    box.className = "usage";
    box.setAttribute("aria-label", "Uso de la consulta");

    const isNum = (v) => typeof v === "number" && Number.isFinite(v);
    const text = (v) => (typeof v === "string" && v.trim() !== "") ? v : null;
    const fields = [
      ["entrada",    isNum(usage?.promptTokens)     ? String(Math.round(usage.promptTokens))     : null, "tokens"],
      ["salida",     isNum(usage?.completionTokens) ? String(Math.round(usage.completionTokens)) : null, "tokens"],
      ["total",      isNum(usage?.totalTokens)      ? String(Math.round(usage.totalTokens))      : null, "tokens"],
      ["modelo",     text(usage?.model),                                                          null],
      ["fin",        text(usage?.finishReason),                                                   null],
      // Hasta 2 decimales, sin ceros sobrantes.
      ["velocidad",  isNum(usage?.tokensPerSecond)  ? String(Math.round(usage.tokensPerSecond * 100) / 100) : null, "tokens/s"]
    ];

    for (const [label, value, unit] of fields) {
      const item = document.createElement("span");
      item.append(`${label}: `);
      const v = document.createElement(value === null ? "i" : "b");
      if (value === null) v.className = "na";
      v.textContent = value === null ? NOT_AVAILABLE : (unit ? `${value} ${unit}` : value);
      item.append(v);
      box.append(item);
    }
    return box;
  }

  /* Reto 3: muestra de que archivo(s) salieron los fragmentos usados y un extracto de cada uno. */
  function buildSources(sources) {
    const box = document.createElement("div");
    box.className = "sources";
    if (!Array.isArray(sources) || sources.length === 0) {
      box.textContent = "fuentes: ningún fragmento recuperado";
      return box;
    }
    const files = [...new Set(sources.map(x => x?.fileName || "desconocido"))];
    const details = document.createElement("details");
    const summary = document.createElement("summary");
    const label = document.createElement("b");
    label.textContent = "fuentes: ";
    summary.append(label, document.createTextNode(
      `${files.join(", ")} (${sources.length} fragmentos recuperados)`));
    const list = document.createElement("ol");
    for (const x of sources) {
      const li = document.createElement("li");
      li.textContent = `${x?.fileName || "desconocido"}: ${x?.excerpt || ""}`;   // textContent: sin inyección
      list.append(li);
    }
    details.append(summary, list);
    box.append(details);
    return box;
  }

  function addTurn(who, label, text, stamp, usage, sources) {
    $empty?.remove();

    const turn = document.createElement("div");
    turn.className = "turn";
    turn.dataset.who = who;

    const head = document.createElement("span");
    head.className = "who";
    head.textContent = label;

    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;          // textContent, nunca innerHTML: evita inyección

    turn.append(head, body);

    if (stamp) {
      const s = document.createElement("span");
      s.className = "stamp";
      s.innerHTML = stamp;            // solo cadenas construidas aquí, sin datos del modelo
      turn.append(s);
    }

    // Solo las respuestas correctas reciben metricas; los turnos de error no pasan `usage`.
    if (usage !== undefined) {
      turn.append(buildUsage(usage));
    }
    if (sources !== undefined) {
      turn.append(buildSources(sources));
    }

    $transcript.append(turn);
    $transcript.scrollTop = $transcript.scrollHeight;
    return turn;
  }

  function setBusy(busy) {
    $input.disabled = busy;
    $send.disabled = busy;
    $send.textContent = busy ? "Generando…" : "Enviar";
    $hint.textContent = busy ? "El modelo está respondiendo. Puede tardar en la primera consulta." : "";
  }

  /* ---------- Salud del modelo (usa /health/llm del backend) ---------- */

  async function probe() {
    $dot.dataset.state = "probing";
    $probeText.textContent = "comprobando el modelo…";
    try {
      const res = await fetch(`${API}/health/llm`, { signal: AbortSignal.timeout(8000) });
      const data = await res.json().catch(() => null);
     if (res.ok && data?.estado === "disponible") {
        
        $dot.dataset.state = "up";
        $probeText.textContent =
          `Ollama activo · ${data.modelo || "modelo disponible"}`;

      } else {
        $dot.dataset.state = "down";
        $probeText.textContent = "ollama no responde";
      }
    } catch {
      $dot.dataset.state = "down";
      $probeText.textContent = `backend inalcanzable en ${API}`;
    }
  }

  /* ---------- Envío ---------- */

  async function ask(question) {
    const started = performance.now();
    setBusy(true);

    try {
      const res = await fetch(`${API}/api/v1/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, sessionId: SESSION_ID }),
        signal: AbortSignal.timeout(TIMEOUT_MS)
      });

      const data = await res.json().catch(() => null);
      const roundTrip = Math.round(performance.now() - started);

      // El backend responde 502 con status "error" cuando el modelo no devuelve texto.
      if (!res.ok) {
        addTurn("fault", "error", `El backend respondió HTTP ${res.status}.` +
          (data?.status ? ` status=${data.status}` : "") +
          " Revisa los logs del contenedor pruebachat_backend.");
        return;
      }

      // Comprobación explícita: "" es falsy, así que nunca usar answer || otraCosa.
      const answer = typeof data?.answer === "string" ? data.answer : "";

      if (data?.status !== "success" || answer.trim() === "") {
        addTurn("fault", "respuesta vacía",
          "El backend contestó correctamente pero sin texto. Suele significar que el modelo " +
          "no está descargado en Ollama o que agotó el presupuesto de tokens.");
        return;
      }

      addTurn("bot", "modelo", answer,
        `<b>${data.elapsedMs} ms</b> en el modelo · ${roundTrip} ms total · ${data.requestId}`,
        data.usage ?? {},   // respuesta correcta sin `usage`: todos los valores "no disponible"
        data.sources ?? []);

    } catch (err) {
      const msg = err?.name === "TimeoutError"
        ? `Sin respuesta tras ${TIMEOUT_MS / 1000} s. El modelo puede seguir cargándose en memoria.`
        : `No se pudo contactar el backend en ${API}. ¿Está levantado el contenedor?`;
      addTurn("fault", "error", msg);
    } finally {
      setBusy(false);
      $input.focus();
      probe();
    }
  }

  $form.addEventListener("submit", (e) => {
    e.preventDefault();
    const question = $input.value.trim();
    if (!question) return;
    addTurn("user", "tú", question);
    $input.value = "";
    ask(question);
  });

  /* ---------- RAG: carga de documentos ---------- */

  const $uploader     = document.getElementById("uploader");
  const $file         = document.getElementById("file");
  const $uploadBtn    = document.getElementById("upload");
  const $uploadStatus = document.getElementById("upload-status");


/*
  $uploader.addEventListener("submit", async (e) => {
    e.preventDefault();
    const file = $file.files[0];
    if (!file) { $uploadStatus.textContent = "Selecciona un archivo primero."; return; }

    // FormData arma el cuerpo multipart/form-data. No fijes Content-Type a mano:
    // el navegador lo pone con el "boundary" correcto.
    const form = new FormData();
    form.append("file", file);

    $uploadBtn.disabled = true;
    $uploadStatus.textContent = `Indexando ${file.name}… (calculando embeddings)`;
    try {
      const res = await fetch(`${API}/api/v1/documents`, {
        method: "POST",
        body: form,
        signal: AbortSignal.timeout(TIMEOUT_MS)
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || data?.status !== "ok") throw new Error(`HTTP ${res.status}`);
      $uploadStatus.textContent =
        `✓ ${data.fileName}: ${data.chunks} fragmentos indexados en ${data.elapsedMs} ms`;
    } catch (err) {
      $uploadStatus.textContent = `No se pudo indexar el documento (${err.message}).`;
    } finally {
      $uploadBtn.disabled = false;
    }
  });
*/
  probe();
  $input.focus();
})();


</script>
</body>
</html>
